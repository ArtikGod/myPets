version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: psychology_bot_db
    environment:
      POSTGRES_DB: psychology_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - psychology_bot_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psychology_bot_backend
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/psychology_bot
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - psychology_bot_network

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: psychology_bot_telegram
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    volumes:
      - ./bot:/app
      - /app/node_modules
    networks:
      - psychology_bot_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: psychology_bot_frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - psychology_bot_network

volumes:
  postgres_data:

networks:
  psychology_bot_network:
    driver: bridge